<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Web2API · 控制台</title>
  <link rel="stylesheet" href="admin.css?v=webui-1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body data-bg-applied="0">

  <!-- ─── Login overlay ─────────────────────────────────────────────── -->
  <div id="login-overlay" class="login-overlay hidden">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
        </svg>
      </div>
      <h1 class="login-title">Gemini Web2API</h1>
      <p class="login-subtitle">管理控制台 · 请输入密码</p>
      <form id="login-form" class="login-form" autocomplete="off">
        <input id="login-password" type="password" class="login-input" placeholder="管理员密码" autocomplete="current-password" />
        <button type="submit" class="login-btn">登 录</button>
        <p id="login-error" class="login-error"></p>
      </form>
    </div>
  </div>

  <!-- ─── App shell ────────────────────────────────────────────────── -->
  <div id="app" class="app hidden">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
        </svg>
        <span class="brand-text">Gemini Web2API</span>
      </div>
      <nav class="nav">
        <a href="#/overview" class="nav-item" data-route="overview">
          <span class="nav-icon">📊</span><span class="nav-label">概览</span>
        </a>
        <a href="#/settings" class="nav-item" data-route="settings">
          <span class="nav-icon">⚙️</span><span class="nav-label">设置</span>
        </a>
        <a href="#/keys" class="nav-item" data-route="keys">
          <span class="nav-icon">🔑</span><span class="nav-label">密钥</span>
        </a>
        <a href="#/models" class="nav-item" data-route="models">
          <span class="nav-icon">🧠</span><span class="nav-label">模型</span>
        </a>
        <a href="#/appearance" class="nav-item" data-route="appearance">
          <span class="nav-icon">🎨</span><span class="nav-label">外观</span>
        </a>
      </nav>
      <button id="logout-btn" class="nav-item nav-logout">
        <span class="nav-icon">⏻</span><span class="nav-label">退出登录</span>
      </button>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button id="menu-toggle" class="menu-toggle" aria-label="菜单">☰</button>
        <h1 id="page-title" class="page-title">概览</h1>
      </header>

      <div class="content">
        <!-- Overview -->
        <section id="page-overview" class="page hidden">
          <div class="stat-grid" id="stat-grid"></div>
          <div class="card">
            <div class="card-head">
              <h2 class="card-title">最近请求</h2>
              <button class="btn btn-danger" id="reset-stats-btn">重置统计</button>
            </div>
            <div class="table-wrap">
              <table class="data-table" id="history-table">
                <thead><tr><th>时间</th><th>路径</th><th>状态</th><th>延迟</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- Settings -->
        <section id="page-settings" class="page hidden">
          <div class="card">
            <div class="card-head"><h2 class="card-title">运行参数</h2></div>
            <form id="settings-form" class="form-grid">
              <label class="field">
                <span class="field-label">重试次数</span>
                <input type="number" data-field="retry_attempts" min="0" max="10" />
              </label>
              <label class="field">
                <span class="field-label">重试间隔 (秒)</span>
                <input type="number" data-field="retry_delay_sec" min="0" />
              </label>
              <label class="field">
                <span class="field-label">请求超时 (秒)</span>
                <input type="number" data-field="request_timeout_sec" min="1" />
              </label>
              <label class="field">
                <span class="field-label">默认模型</span>
                <input type="text" data-field="default_model" placeholder="gemini-3.5-flash" />
              </label>
              <label class="field field-toggle">
                <span class="field-label">记录请求日志</span>
                <label class="switch">
                  <input type="checkbox" data-field="log_requests" />
                  <span class="slider"></span>
                </label>
              </label>
            </form>
          </div>

          <div class="card">
            <div class="card-head"><h2 class="card-title">Gemini 凭据</h2></div>
            <form class="form-grid">
              <label class="field">
                <span class="field-label">gemini_bl</span>
                <input type="text" data-field="gemini_bl" />
              </label>
              <label class="field">
                <span class="field-label">auth_user</span>
                <input type="text" data-field="auth_user" />
              </label>
              <label class="field field-full">
                <span class="field-label">xsrf_token</span>
                <input type="text" data-field="xsrf_token" />
              </label>
            </form>
          </div>

          <div class="card">
            <div class="card-head"><h2 class="card-title">网络与存储</h2></div>
            <form class="form-grid">
              <label class="field field-full">
                <span class="field-label">代理 proxy</span>
                <input type="text" data-field="proxy" placeholder="http://127.0.0.1:7890" />
              </label>
              <label class="field field-full">
                <span class="field-label">cookie 文件路径</span>
                <input type="text" data-field="cookie_file" />
              </label>
            </form>
          </div>

          <div class="form-actions">
            <button class="btn btn-primary" id="save-settings-btn">保存设置</button>
            <span id="settings-dirty" class="dirty-hint hidden">有未保存更改</span>
          </div>
        </section>

        <!-- Keys -->
        <section id="page-keys" class="page hidden">
          <div class="card">
            <div class="card-head">
              <h2 class="card-title">新建密钥</h2>
            </div>
            <form id="add-key-form" class="form-grid">
              <label class="field">
                <span class="field-label">名称 *</span>
                <input type="text" id="new-key-name" placeholder="my-app" required />
              </label>
              <label class="field field-full">
                <span class="field-label">密钥 (留空自动生成,须以 sk- 开头)</span>
                <input type="text" id="new-key-value" placeholder="sk-..." />
              </label>
              <label class="field field-full">
                <span class="field-label">描述</span>
                <input type="text" id="new-key-desc" />
              </label>
              <div class="form-actions">
                <button class="btn btn-primary" type="submit">创建密钥</button>
              </div>
            </form>
            <div id="new-key-result" class="new-key-result hidden"></div>
          </div>

          <div class="card">
            <div class="card-head"><h2 class="card-title">已存在密钥</h2></div>
            <div class="table-wrap">
              <table class="data-table" id="keys-table">
                <thead><tr><th>名称</th><th>密钥</th><th>描述</th><th></th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- Models -->
        <section id="page-models" class="page hidden">
          <div class="card">
            <div class="card-head"><h2 class="card-title">可用模型</h2><span class="card-sub" id="model-count"></span></div>
            <div class="model-grid" id="model-grid"></div>
          </div>
        </section>

        <!-- Appearance -->
        <section id="page-appearance" class="page hidden">
          <div class="card">
            <div class="card-head"><h2 class="card-title">背景外观</h2></div>
            <p class="muted">所有外观设置仅保存在浏览器 localStorage 中,不会同步到服务端。</p>
            <div class="preset-grid" id="preset-grid"></div>
            <div class="form-grid">
              <label class="field field-full">
                <span class="field-label">自定义背景 URL</span>
                <input type="text" id="bg-url" placeholder="https://..." />
              </label>
              <label class="field field-full">
                <span class="field-label">或上传本地图片</span>
                <input type="file" id="bg-file" accept="image/*" />
              </label>
              <div class="form-actions">
                <button class="btn btn-primary" id="apply-bg-btn">应用背景</button>
                <button class="btn btn-ghost" id="reset-bg-btn">重置为默认</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- ─── Mobile sidebar backdrop ──────────────────────────────────── -->
  <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

  <!-- ─── Toast container ──────────────────────────────────────────── -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts (load order matters) -->
  <script src="utils.js?v=webui-1"></script>
  <script src="api.js?v=webui-1"></script>
  <script src="page-overview.js?v=webui-1"></script>
  <script src="page-settings.js?v=webui-1"></script>
  <script src="page-keys.js?v=webui-1"></script>
  <script src="page-models.js?v=webui-1"></script>
  <script src="page-appearance.js?v=webui-1"></script>
  <script src="admin.js?v=webui-1"></script>
</body>
</html>
